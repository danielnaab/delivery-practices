name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # scions/ are git submodules (graft v2.13.0): the checkers below run from one

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ">=0.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --tb=short

      - name: Backlink scanner
        run: PYTHONPATH=scions/knowledge-base-kit/src python3 -m backlink_scanner .

      - name: KB linter
        run: PYTHONPATH=scions/knowledge-base-kit/src python3 -m kb_linter .

      - name: Link validator
        run: PYTHONPATH=scions/knowledge-base-kit/src python3 -m link_validator .
