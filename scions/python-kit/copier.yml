# Copier template configuration for python-kit
# This file defines template variables and generation settings

_min_copier_version: "9.3.0"  # migrations in the command/when form

# Answers file configuration
_answers_file: .copier-answers.yml

# Template file extension
_templates_suffix: .jinja

# Files to exclude from template
_exclude:
  - copier.yml
  - .git
  - .github
  - .venv
  - __pycache__
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - .pytest_cache
  - htmlcov
  - .coverage
  - .ruff_cache
  - uv.lock
  - "*.egg-info"
  - dist
  - build
  - .DS_Store
  - .gitattributes  # python-kit's own export rules
  - CHANGELOG.md  # python-kit's releases, not the project's
  # Template documentation stays in template, not generated in projects
  - docs/copier
  - docs/architecture
  - docs/decisions
  - docs/guides
  - docs/reference
  - knowledge-base.yaml  # Template KB config, not for generated projects
  - "{% if not include_github_actions %}.github{% endif %}"
  - "{% if not include_dev_scripts %}scripts{% endif %}"

# Files users will modify - protect during updates
_skip_if_exists:
  - src/{{ package_name }}/domain/entity.py
  - src/{{ package_name }}/services/example_service.py
  - src/{{ package_name }}/adapters/in_memory_repository.py
  - src/{{ package_name }}/cli/commands/example.py
  - tests/unit/*.py
  - tests/integration/*.py
  - README.md  # Users will customize
  - docs/agents.md  # Project-specific agent entrypoint
  - knowledge-base.yaml  # Project-specific KB config
  # graft's workflows: generated once, then graft-upgrade alone moves them with graft's pin (their
  # `# managed by graft` line), so a python-kit update never conflicts with or reverts them.
  - .forgejo/workflows/graft-check.yaml
  - .forgejo/workflows/graft-upgrade.yaml

# Template questions (user prompts)

project_name:
  type: str
  help: Project name (human-readable)
  default: My Python Project
  validator: "{% if not project_name %}Project name cannot be empty{% endif %}"

project_description:
  type: str
  help: Short project description
  default: A Python project built with modern best practices

package_name:
  type: str
  help: Python package name (snake_case)
  default: "{{ project_name.lower().replace(' ', '_').replace('-', '_') }}"
  validator: >-
    {% if not package_name.isidentifier() %}
    Package name must be a valid Python identifier (snake_case, no hyphens)
    {% elif package_name.startswith('_') %}
    Package name cannot start with underscore
    {% elif package_name in ['test', 'tests', 'src', 'lib'] %}
    Reserved package name
    {% endif %}

author_name:
  type: str
  help: Author name
  default: Your Name

author_email:
  type: str
  help: Author email
  default: you@example.com
  validator: >-
    {% if '@' not in author_email %}
    Must be a valid email address
    {% endif %}

python_version:
  type: str
  help: Minimum Python version
  default: "3.11"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"

include_example_code:
  type: bool
  help: Include example domain code and tests?
  default: true

include_github_actions:
  type: bool
  help: Include GitHub Actions CI/CD workflows?
  default: true

include_dev_scripts:
  type: bool
  help: Include development scripts (setup.sh, test.sh)?
  default: true

graft_docs:
  type: bool
  help: >-
    Graft pinned copies of python-kit's pattern docs and knowledge-base-kit into scions/?
    Needs Nix. Without it, docs link to GitHub at this template's commit instead.
  default: true

license:
  type: str
  help: Project license
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - BSD-3-Clause
    - GPL-3.0
    - Proprietary

# Computed variables (not shown to user)
cli_command:
  type: str
  default: "{{ package_name }}-cli"
  when: false

module_path:
  type: str
  default: "{{ package_name }}.cli.main"
  when: false

current_year:
  type: str
  default: "2025"
  when: false

# Post-generation tasks
_tasks:
  # Install dependencies
  - command: uv sync
    when: "{{ _copier_operation == 'copy' }}"

  # Initialize git if not exists
  - command: git init
    when: "{{ _copier_operation == 'copy' }}"

  - command: git add .
    when: "{{ _copier_operation == 'copy' }}"

  # Graft the docs before the first commit: README.md and docs/ link into scions/, so a commit
  # without it has broken links (and a link-checking commit hook rejects it, which makes Copier
  # delete the new project). The flake needs its files tracked first, hence after `git add`.
  - command: nix run .#graft
    when: "{{ _copier_operation == 'copy' and graft_docs }}"

  - command: git add .
    when: "{{ _copier_operation == 'copy' and graft_docs }}"

  - command: 'git commit -m "Initial commit from python-kit"'
    when: "{{ _copier_operation == 'copy' }}"

# Migrations: what `copier update` runs when it crosses a version (from < version <= to), in the
# project's directory, after the update (`_stage == "after"`) unless `when` says otherwise. Each
# release's CHANGELOG "Migration" section says what is left to do by hand. Not a migration: setting
# `_src_path` (v2.0.0). Copier reads it to fetch the template before any migration runs, and the
# rendered .copier-answers.yml writes the canonical URL from v2.0.0 on.
_migrations:
  # v2.0.0 renamed the grafted inputs: scions/python-starter/ is now scions/python-kit/ and
  # scions/meta-knowledge-base/ is now scions/knowledge-base-kit/ (`nix run .#graft` rebuilds
  # scions/). The update rewrites the files it manages; this rewrites the paths in the project's own
  # tracked files, which it skips (README.md, docs/agents.md, ...), leaving scions/ and CHANGELOG.md
  # alone.
  - version: v2.0.0
    command: |
      "{{ _copier_python }}" - <<'EOF'
      import pathlib, subprocess
      renames = [("scions/python-starter/", "scions/python-kit/"),
                 ("scions/meta-knowledge-base/", "scions/knowledge-base-kit/")]
      out = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout
      for name in out.decode().split("\0"):
          path = pathlib.Path(name)
          if not name or name.startswith("scions/") or path.name == "CHANGELOG.md" or path.is_symlink() or not path.is_file():
              continue
          try:
              text = path.read_text(encoding="utf-8")
          except UnicodeDecodeError:
              continue
          new = text
          for old, to in renames:
              new = new.replace(old, to)
          if new != text:
              path.write_text(new, encoding="utf-8")
              print(f"python-kit v2.0.0 migration: {name}: scions paths renamed")
      EOF

  # v2.1.0 made the example code `ruff check` clean (B009, UP045, B904, and I001 from `tests` imports,
  # which ruff's isort now sorts in a block of their own). The update fixes the files it
  # manages; this makes the same edits in the example files it skips, where they still read as generated.
  - version: v2.1.0
    command: |
      "{{ _copier_python }}" - <<'EOF'
      import pathlib
      exit_ = "\n        raise typer.Exit(code=1)\n"
      fixes = {
          "src/{{ package_name }}/adapters/in_memory_repository.py": [
              ('entity_id = getattr(entity, "id")', "entity_id = entity.id"),
              ("def get(self, entity_id: str) -> Optional[T]:", "def get(self, entity_id: str) -> T | None:"),
          ],
          "tests/unit/test_example_service.py": [
              ("ServiceContext\nfrom tests.fakes.fake_repository", "ServiceContext\n\nfrom tests.fakes.fake_repository"),
          ],
          "src/{{ package_name }}/cli/commands/example.py": [
              ('typer.echo(f"Validation error: {e}", err=True)' + exit_,
               'typer.echo(f"Validation error: {e}", err=True)' + exit_.replace("1)", "1) from e")),
              ('typer.echo(f"Error: {e}", err=True)' + exit_,
               'typer.echo(f"Error: {e}", err=True)' + exit_.replace("1)", "1) from e")),
          ],
      }
      for name, pairs in fixes.items():
          path = pathlib.Path(name)
          if path.is_symlink() or not path.is_file():
              continue
          text = path.read_text(encoding="utf-8")
          new = text
          for old, to in pairs:
              new = new.replace(old, to)
          if "Optional[" not in new:
              new = new.replace("from typing import Generic, Optional, TypeVar\n", "from typing import Generic, TypeVar\n")
          if new != text:
              path.write_text(new, encoding="utf-8")
              print(f"python-kit v2.1.0 migration: {name}: ruff fixes applied")
      EOF
