apiVersion: kb/v1
name: delivery-practices
description: "Knowledge base for software delivery practices enabling fast and safe AI-assisted development"

entrypoints:
  human: docs/README.md
  agent: CLAUDE.md

meta:
  entrypoint: "scions/knowledge-base-kit/README.md"

imports:
  - kind: local
    path: scions/knowledge-base-kit
    relationship: foundational
  - kind: local
    path: scions/living-specifications
    relationship: foundational

paths:
  docs: docs
  notes: notes

sources:
  canonical:
    - path: docs/**
      note: "Practice documentation is canonical"

rules:
  lifecycle:
    statuses: ["draft", "working", "stable", "deprecated"]
  provenance:
    requiredFor: ["practice-recommendations", "factual-claims", "operational-guidance"]
  writes:
    allow: ["docs/**", "notes/**", "specs/**", "src/**", "tests/**"]
    deny: ["secrets/**", "credentials/**"]
    # scions/** (git submodules) is left out of deny on purpose: an edit there is a change to that provider,
    # made on a branch in the scion and upstreamed. Ask first (the agent rules: CLAUDE.md). This kit version's
    # writes rules have allow/deny only, no ask-first list.
